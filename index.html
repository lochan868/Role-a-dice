<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roll a Dice</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7Lcu5dXCKzGrLq62o9kgNcC8IazJhiZTQOaWzgwkfig&s=10) ;
            background-repeat: no-repeat;
            background-size: cover;
            
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .dice {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            background: white;
            border: 5px solid #333;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 15px;
            gap: 5px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .dot {
            width: 22px;
            height: 22px;
            background: #333;
            border-radius: 50%;
            justify-self: center;
            align-self: center;
        }

        button {
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #5369d8;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95);
        }

        .result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .history {
            margin-top: 20px;
            color: #666;
            font-size: 15px;
        }

        .rolling {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%   { transform: rotate(0deg); }
            20%  { transform: rotate(15deg); }
            40%  { transform: rotate(-15deg); }
            60%  { transform: rotate(10deg); }
            80%  { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎲 Roll a Dice</h1>
        <p class="subtitle">Click the button to roll the dice</p>

        <div class="dice" id="dice">
            <!-- Dice dots will be generated by JavaScript -->
        </div>

        <button onclick="rollDice()">Roll Dice</button>

        <div class="result" id="result">
            Roll the dice!
        </div>

        <div class="history" id="history">
            Rolls: 0
        </div>
    </div>

    <script>
        const dice = document.getElementById("dice");
        const result = document.getElementById("result");
        const history = document.getElementById("history");

        let rollCount = 0;

        // Dice dot positions
        const positions = {
            1: [5],
            2: [1, 9],
            3: [1, 5, 9],
            4: [1, 3, 7, 9],
            5: [1, 3, 5, 7, 9],
            6: [1, 3, 4, 6, 7, 9]
        };

        function displayDice(number) {
            dice.innerHTML = "";

            positions[number].forEach(position => {
                const dot = document.createElement("div");
                dot.classList.add("dot");

                // Place the dot in the 3x3 grid
                dot.style.gridColumn = ((position - 1) % 3) + 1;
                dot.style.gridRow = Math.floor((position - 1) / 3) + 1;

                dice.appendChild(dot);
            });
        }

        function rollDice() {
            dice.classList.remove("rolling");

            // Restart animation
            void dice.offsetWidth;
            dice.classList.add("rolling");

            const number = Math.floor(Math.random() * 6) + 1;

            displayDice(number);

            rollCount++;

            result.textContent = `You rolled: ${number} 🎉`;
            history.textContent = `Rolls: ${rollCount}`;
        }

        // Show dice number 1 when the page loads
        displayDice(1);
    </script>

</body>
</html
